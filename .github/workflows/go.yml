name: Go Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      # Verify dependencies
      - name: Verify dependencies
        run: go mod verify

      # Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Run go vet
      - name: Run go vet
        run: go vet ./...

      # Install staticcheck
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      # Run staticcheck
      - name: Run staticcheck
        run: staticcheck ./...

      # Install golint
      - name: Install golint
        run: go install golang.org/x/lint/golint@latest

      # Run golint
      - name: Run golint
        run: golint ./...


      # Build backend
      - name: Build
        run: go build -v ./...

      # Run tests with race detection
      - name: Test
        run: go test -race -vet=off ./...
